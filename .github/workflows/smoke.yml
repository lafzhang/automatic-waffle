name: Research environment smoke checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "${{ matrix.profile }} smoke check"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [python, r, bioc, fiji]
    env:
      PROFILE: "${{ matrix.profile }}"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the profile
        run: bash scripts/setup.sh "$PROFILE"
      - name: Verify the profile using synthetic data
        run: bash scripts/check.sh "$PROFILE"
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "${{ matrix.profile }}-smoke-results"
          path: outputs/smoke/
          if-no-files-found: ignore
          retention-days: 14
