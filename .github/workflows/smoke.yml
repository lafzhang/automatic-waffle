name: Research environment smoke checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "${{ matrix.profile }} smoke check"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [python, r, bioc, fiji]
    env:
      PROFILE: "${{ matrix.profile }}"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install the profile
        run: bash scripts/setup.sh "$PROFILE"
      - name: Verify the profile using synthetic data
        run: bash scripts/check.sh "$PROFILE"
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: "${{ matrix.profile }}-smoke-results"
          path: outputs/smoke/
          if-no-files-found: ignore
          retention-days: 14
